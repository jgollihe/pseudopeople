[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pseudopeople"
dynamic = ["version"]
description = "pseudopeople generates realistic simulated data about a fictional United States population, designed for use in testing entity resolution (record linkage) methods or other data science algorithms at scale."
readme = "README.rst"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "The pseudopeople developers", email = "vivarium.dev@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: BSD",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Life",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # Polars' hash() is only stable within a version, and noise randomness is built
    # on it, so the same seed only reproduces the same output on the same minor version.
    "polars>=2.0,<2.1",
    "pyyaml>=6",
    "loguru>=0.7",
    "tqdm>=4.66",
    "packaging>=23",
    "vivarium-config-tree>=5.2.1,<6.0.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.2", "pyarrow>=16"]

[project.urls]
Homepage = "https://github.com/ihmeuw/pseudopeople"
Documentation = "https://pseudopeople.readthedocs.io"

[dependency-groups]
test = [
    "pytest>=8.4",
    "pytest-mock>=3.14",
    "scipy>=1.13",
]
lint = ["ruff>=0.6"]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "sphinx-click",
    "ipython",
    "matplotlib",
]
bench = ["psutil>=5.9", "pyarrow>=16"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "bench" },
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/pseudopeople/_version.py"
template = "__version__ = \"{version}\"\n"

[tool.hatch.build.targets.wheel]
packages = ["src/pseudopeople"]

[tool.hatch.build.targets.sdist]
include = ["src/pseudopeople", "tests", "docs", "CHANGELOG.rst", "README.rst", "LICENSE"]

[tool.pytest.ini_options]
xfail_strict = true
testpaths = ["tests"]

[tool.ruff]
line-length = 94
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
